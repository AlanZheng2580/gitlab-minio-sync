spec:
  inputs:
    repositories:
      description: "One namespace/project|branch entry per line"
      type: string
    output_name:
      type: string
      default: configs.tar.gz
    minio_bucket:
      type: string
      default: config-packages
    minio_object:
      type: string
      default: configs.tar.gz
    resource_group:
      type: string
      default: config-sync
    batch_delay_seconds:
      type: number
      default: 5
---

config-sync:
  image: alpine:3.21.3
  stage: deploy
  resource_group: $[[ inputs.resource_group ]]
  variables:
    CONFIG_SYNC_REPOSITORIES: $[[ inputs.repositories ]]
    CONFIG_SYNC_OUTPUT: $[[ inputs.output_name ]]
    CONFIG_SYNC_BUCKET: $[[ inputs.minio_bucket ]]
    CONFIG_SYNC_OBJECT: $[[ inputs.minio_object ]]
    CONFIG_SYNC_BATCH_DELAY: "$[[ inputs.batch_delay_seconds ]]"
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash curl git jq minio-client tar ca-certificates
  script:
    - |
      bash <<'CONFIG_SYNC_SCRIPT'
      set -Eeuo pipefail
      log() { printf '[config-sync] %s\n' "$*"; }
      fail() { log "ERROR: $*" >&2; exit 1; }
      required=(CONFIG_GITLAB_URL CONFIG_GIT_USERNAME CONFIG_GIT_TOKEN MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY SYNC_API_TOKEN)
      for name in "${required[@]}"; do [ -n "${!name:-}" ] || fail "Required CI variable $name is missing"; done
      [[ "$CONFIG_SYNC_OUTPUT" != */* && "$CONFIG_SYNC_OUTPUT" == *.tar.gz ]] || fail "output_name must be a .tar.gz filename"
      [[ "$CONFIG_SYNC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || fail "Invalid MinIO bucket name"
      [ -n "$CONFIG_SYNC_OBJECT" ] || fail "minio_object is empty"
      [[ "$CONFIG_SYNC_BATCH_DELAY" =~ ^[0-9]+$ ]] || fail "batch_delay_seconds must be a non-negative integer"

      log "Current pipeline: $CI_PIPELINE_ID"
      log "Batch delay: ${CONFIG_SYNC_BATCH_DELAY}s"
      sleep "$CONFIG_SYNC_BATCH_DELAY"
      api_file=$(mktemp)
      code=$(curl --silent --show-error --output "$api_file" --write-out '%{http_code}' \
        --header "PRIVATE-TOKEN: $SYNC_API_TOKEN" \
        --get --data-urlencode "ref=$CI_COMMIT_REF_NAME" --data-urlencode "source=$CI_PIPELINE_SOURCE" \
        --data-urlencode 'order_by=id' --data-urlencode 'sort=desc' --data-urlencode 'per_page=1' \
        "$CONFIG_GITLAB_URL/api/v4/projects/$CI_PROJECT_ID/pipelines") || fail "GitLab latest-pipeline API request failed"
      [ "$code" = 200 ] || fail "GitLab latest-pipeline API returned HTTP $code"
      latest=$(jq -er '.[0].id' "$api_file") || fail "GitLab latest-pipeline API returned no pipeline"
      log "Latest pipeline: $latest"
      if [ "$latest" -gt "$CI_PIPELINE_ID" ]; then
        log "Newer sync pipeline exists."
        log "Skip this pipeline."
        exit 0
      fi
      log "This is the latest pipeline. Continue."

      mkdir -p workspace
      count=0
      while IFS= read -r entry || [ -n "$entry" ]; do
        entry=${entry%$'\r'}
        [ -z "$entry" ] && continue
        [[ "$entry" =~ ^([A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+)\|([^[:space:]|]+)$ ]] || fail "Invalid repositories entry: $entry (expected namespace/project|branch)"
        project=${BASH_REMATCH[1]}; branch=${BASH_REMATCH[3]}; repo=${project##*/}
        [ ! -e "workspace/$repo" ] || fail "Duplicate repository basename: $repo"
        encoded_user=$(jq -nr --arg v "$CONFIG_GIT_USERNAME" '$v|@uri')
        encoded_token=$(jq -nr --arg v "$CONFIG_GIT_TOKEN" '$v|@uri')
        case "$CONFIG_GITLAB_URL" in
          http://*) clone_url="http://${encoded_user}:${encoded_token}@${CONFIG_GITLAB_URL#http://}/${project}.git" ;;
          https://*) clone_url="https://${encoded_user}:${encoded_token}@${CONFIG_GITLAB_URL#https://}/${project}.git" ;;
          *) fail "CONFIG_GITLAB_URL must start with http:// or https://" ;;
        esac
        log "Sync $project @ $branch"
        if ! git clone --quiet --depth 1 --single-branch --branch "$branch" "$clone_url" "workspace/$repo"; then
          fail "Clone failed for $project@$branch (repository/branch/authentication)"
        fi
        commit=$(git -C "workspace/$repo" rev-parse HEAD) || fail "Could not determine commit for $project@$branch"
        rm -rf "workspace/$repo/.git"
        log "Commit: $commit"
        count=$((count + 1))
      done <<< "$CONFIG_SYNC_REPOSITORIES"
      [ "$count" -gt 0 ] || fail "repositories input contains no entries"

      log "Creating $CONFIG_SYNC_OUTPUT"
      tar -C workspace -czf "$CONFIG_SYNC_OUTPUT" .
      if tar -tzf "$CONFIG_SYNC_OUTPUT" | grep -Eq '(^|/)\.git(/|$)'; then
        fail "Archive unexpectedly contains .git"
      fi
      if ! mcli alias set config-minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null; then
        fail "MinIO connection/authentication failed"
      fi
      mcli stat "config-minio/$CONFIG_SYNC_BUCKET" >/dev/null || fail "MinIO bucket unavailable: $CONFIG_SYNC_BUCKET"
      log "Upload: s3://$CONFIG_SYNC_BUCKET/$CONFIG_SYNC_OBJECT"
      mcli cp "$CONFIG_SYNC_OUTPUT" "config-minio/$CONFIG_SYNC_BUCKET/$CONFIG_SYNC_OBJECT" >/dev/null || fail "MinIO upload failed"
      log "Done"
      CONFIG_SYNC_SCRIPT
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - $[[ inputs.output_name ]]
